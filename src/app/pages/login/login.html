<div class="login-container">

  <div class="login-box">

    <h1>Login</h1>

    <div class="campo">
      <label>Usuário</label>

      <input
        type="text"
        [(ngModel)]="usuario"
        placeholder="Digite seu usuário"
      >
    </div>

    <div class="campo">
      <label>Senha</label>

      <input
        type="password"
        [(ngModel)]="senha"
        placeholder="Digite sua senha"
      >
    </div>

    <button (click)="entrar()">
      Entrar
    </button>

  </div>

</div>
